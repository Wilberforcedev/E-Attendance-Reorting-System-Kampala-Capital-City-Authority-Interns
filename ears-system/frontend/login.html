<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in | EARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f3f6f4; display: grid; place-items: center; padding: 1rem; }
        .login-card { width: min(100%, 27rem); border: 0; border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0, 0, 0, .1); }
        .brand-mark { color: #008540; font-size: 1.7rem; font-weight: 800; letter-spacing: .04em; }
        .btn-ears { background: #008540; color: #fff; }
        .btn-ears:hover, .btn-ears:focus { background: #006d34; color: #fff; }
    </style>
</head>
<body>
    <main class="card login-card">
        <div class="card-body p-4 p-md-5">
            <p class="brand-mark mb-1">EARS</p>
            <h1 class="h4 mb-1">Sign in</h1>
            <p class="text-secondary mb-4">E-Attendance Reporting System</p>

            <div id="login-error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Work email</label>
                    <input id="email" name="email" class="form-control form-control-lg" type="email" autocomplete="username" maxlength="190" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" class="form-control form-control-lg" type="password" autocomplete="current-password" maxlength="1024" required>
                </div>
                <button id="submit-button" class="btn btn-ears btn-lg w-100" type="submit">Sign in</button>
            </form>
            <p class="small text-secondary mt-4 mb-0">Access is available only to accounts enabled by your system administrator.</p>
        </div>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const submitButton = document.getElementById('submit-button');

        const status = new URLSearchParams(window.location.search).get('status');
        if (status === 'unavailable') {
            errorBox.textContent = 'Sign-in service is unavailable. Please try again later.';
            errorBox.classList.remove('d-none');
        } else if (status === 'role') {
            errorBox.textContent = 'The portal for this account role is not available yet. Contact the system administrator.';
            errorBox.classList.remove('d-none');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('d-none');
            submitButton.disabled = true;
            submitButton.textContent = 'Signing in…';

            try {
                const response = await fetch('/backend/auth/login.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) {
                    errorBox.textContent = result.message || 'Sign-in failed. Check your details and try again.';
                    errorBox.classList.remove('d-none');
                    return;
                }

                if (result.user.role === 'intern') {
                    window.location.replace('/client/');
                } else if (result.user.role === 'admin') {
                    window.location.replace('/admin/');
                } else {
                    errorBox.textContent = 'The portal for this account role is not available yet. Contact the system administrator.';
                    errorBox.classList.remove('d-none');
                    const csrfCookie = document.cookie.split('; ').find((cookie) => cookie.startsWith('ears_csrf='));
                    const csrfToken = csrfCookie ? decodeURIComponent(csrfCookie.slice('ears_csrf='.length)) : '';
                    await fetch('/backend/auth/logout.php', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'X-CSRF-Token': csrfToken },
                    }).catch(() => {});
                }
            } catch {
                errorBox.textContent = 'Could not reach the sign-in service. Please try again later.';
                errorBox.classList.remove('d-none');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
